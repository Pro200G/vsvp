version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: surveillance-postgres
    environment:
      POSTGRES_DB: surveillance_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - surveillance-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: surveillance-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@surveillance.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    networks:
      - surveillance-network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  surveillance-network:
    driver: bridge